# 生产环境配置
services:
  dredge:
    image: ghcr.io/0mao0/dredgescope:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dredge_app
    ports:
      - "8000:80"
    volumes:
      - ./backend/data:/app/backend/data
      - ./.env:/app/.env:ro
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  scheduler:
    image: ghcr.io/0mao0/dredgescope:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dredge_scheduler
    volumes:
      - ./backend/data:/app/backend/data
      - ./.env:/app/.env:ro
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "scheduler"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time; hb = float(open('/app/backend/data/scheduler.heartbeat').read()); age = time.time() - hb; assert age < 180, f'heartbeat {age:.0f}s old'"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
