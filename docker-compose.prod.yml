# 生产环境配置
services:
  dredge:
    image: ghcr.io/0mao0/dredgescope:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dredge_app
    ports:
      - "8000:80"
    volumes:
      - ./backend/data:/app/backend/data
      - ./.env:/app/.env:ro
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  scheduler:
    image: ghcr.io/0mao0/dredgescope:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dredge_scheduler
    volumes:
      - ./backend/data:/app/backend/data
      - ./.env:/app/.env:ro
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "scheduler"]
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  watchtower:
    image: containrrr/watchtower
    container_name: dredge_watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL:-}
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
