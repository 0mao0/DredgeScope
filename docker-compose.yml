services:
  dredge:
    image: ghcr.io/0mao0/dredgescope:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dredge_app
    ports:
      - "8000:80"
    volumes:
      - ./backend/data:/app/backend/data
      - ./.env:/app/.env:ro
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  scheduler:
    image: ghcr.io/0mao0/dredgescope:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dredge_scheduler
    volumes:
      - ./backend/data:/app/backend/data
      - ./.env:/app/.env:ro
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "scheduler"]
    # 调度器是纯定时任务进程，无 HTTP 端口；用心跳文件新鲜度判活（主循环每 60s 刷新，720s 未更新判 unhealthy，与内置 180s 看门狗形成双层防卡死）
    healthcheck:
      test: ["CMD-SHELL", "test $$(find /app/backend/data/scheduler.heartbeat -mmin -12 2>/dev/null)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
